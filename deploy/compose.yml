# Included by market-agri-infra; only the platform gateway publishes a host port.
services:
  transactions-api:
    build:
      context: ../
      dockerfile: Dockerfile
    image: market-agri-transactions-api:local
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    name: platform-${ENV:?set ENV}
    external: true
