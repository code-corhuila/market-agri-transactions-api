# Composition root: every limit of the service is declared here, with its value (Anexo C 5.3.10).
spring:
  application:
    name: market-agri-transactions-api
  lifecycle:
    timeout-per-shutdown-phase: 20s     # graceful shutdown
  web:
    resources:
      add-mappings: false               # an API serves no static files
  # PostgreSQL of market-agri-infra, always as transactions_app. Without these variables the service
  # does not start. The schema comes from market-agri-transactions-db: nothing here migrates (ADR-011).
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10                         # connections
      connection-timeout: 5000                      # ms waiting for a free connection
      connection-init-sql: SET statement_timeout = '5s'   # per statement, on every connection
  sql:
    init:
      mode: never                       # no schema.sql or data.sql, ever (norm 5.2.1)
  # unitPriceCents is an integer (ADR-029): 12.5 is 400, not silently 12 (Jackson's default accepts it).
  jackson:
    deserialization:
      accept-float-as-int: false

server:
  port: ${PORT:8080}
  shutdown: graceful                    # finish in-flight requests before stopping
  tomcat:
    connection-timeout: 5s              # reading the request headers
    keep-alive-timeout: 60s             # idle connection

# Tokens of auth, validated locally (ADR-020, Anexo C 5.3.7): the issuer and the public key by
# configuration. JWT_PUBLIC_KEY is the PEM on one line with literal \n; JWT_PUBLIC_KEY_FILE, a file.
jwt:
  issuer: ${JWT_ISSUER}
  public-key: ${JWT_PUBLIC_KEY:}
  public-key-file: ${JWT_PUBLIC_KEY_FILE:}

# Payment provider (ADR-019): wompi (Web Checkout) or fake (CI, integration, E2E). The Wompi keys
# live only in market-agri-infra/env/<env>.env; the buyer comes back to PUBLIC_BASE_URL/transacciones/<id>.
payment:
  gateway: ${PAYMENT_GATEWAY:}
  public-base-url: ${PUBLIC_BASE_URL:}
  wompi:
    public-key: ${WOMPI_PUBLIC_KEY:}
    integrity-secret: ${WOMPI_INTEGRITY_SECRET:}
    events-secret: ${WOMPI_EVENTS_SECRET:}       # checksum of the events of E-43

# Broker of the domain events (ADR-004, ADR-014): RabbitMQ of market-agri-infra, as transactions_app,
# which may only publish to market-agri.events. Without these variables the service does not start.
broker:
  host: ${RABBITMQ_HOST}
  port: ${RABBITMQ_PORT:5672}
  username: ${BROKER_USERNAME}
  password: ${BROKER_PASSWORD}
  timeout: 3s                           # connection, handshake and waiting for the confirm

# Outbox relay (ADR-014): every second, at most 50 events per run, oldest first.
outbox:
  relay:
    enabled: true
    interval: 1000                      # ms between the end of a run and the next one
    batch-size: 50

# One JSON object per log line; the MDC (correlationId) goes into every line (Anexo C 5.3.9).
logging:
  structured:
    format:
      console: ecs
