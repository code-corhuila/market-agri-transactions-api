# Unit and HTTP tests run without a database: the pool points to an address nobody listens on,
# so readiness reports the database DOWN. The integration tests replace the URL (TransactionsPersistenceIT).
spring.datasource.url=jdbc:postgresql://localhost:1/unreachable
spring.datasource.username=transactions_app
spring.datasource.password=unused
# The issuer of auth (ADR-020) for the Spring tests; the public key comes from
# TransactionsSpringTest, generated per run. Without it the composition root does not start.
jwt.issuer=market-agri-auth
